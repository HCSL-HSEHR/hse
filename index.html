<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#143C64">
<title>Hawkins HSE Reporting</title>
</head>
<body style="margin:0;background:#ECEEEA;font:16px system-ui,sans-serif;color:#143C64">
<div id="m" style="padding:48px 20px;text-align:center">Loading Hawkins HSE Reporting...</div>
<script>
// Launcher for the Hawkins HSE Reporting app. The app itself is served by a
// Power Automate flow; its link arrives once in the #k= part of the staff link
// (never stored here) and is kept on the device.
(async function () {
  var m = document.getElementById('m'), h = location.hash.slice(1), src = '', route = h;
  var ok = function (u) { return /^https:\/\/[a-z0-9.-]+\.(environment\.api\.powerplatform\.com|logic\.azure\.com)(:443)?\//.test(u); };
  try {
    if (h.indexOf('k=') === 0) {
      var i = h.indexOf('!');
      var k = i < 0 ? h.slice(2) : h.slice(2, i);
      route = i < 0 ? '' : h.slice(i + 1);
      k = k.replace(/-/g, '+').replace(/_/g, '/');
      while (k.length % 4) k += '=';
      var u = atob(k);
      if (ok(u)) { src = u; localStorage.setItem('hs_src', u); }
    }
    if (!src) { var s = localStorage.getItem('hs_src') || ''; if (ok(s)) src = s; }
  } catch (e) {}
  history.replaceState(null, '', location.pathname + (route ? '#' + route : ''));
  if (!src) { m.textContent = 'Open the app once from the link in your Hawkins email.'; return; }
  for (var t = 0; t < 3; t++) {
    try {
      var r = await fetch(src, { cache: 'no-store' });
      if (r.ok) { var html = await r.text(); document.open(); document.write(html); document.close(); return; }
    } catch (e) {}
    await new Promise(function (res) { setTimeout(res, 1500 * (t + 1)); });
  }
  m.innerHTML = 'Could not load the app. Check your signal and <a href="" onclick="location.reload();return false">try again</a>.';
})();
</script>
</body>
</html>
